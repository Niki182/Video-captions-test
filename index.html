<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video captions test</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <main>
        <h1>Video captions test</h1>
        <video controls height="400">
            <source src="assets/Wontkins gets hit by a tree.mp4" type="video/mp4">
            <track kind="captions" src="assets/Wontkins gets hit by a tree.vtt" srclang="en" label="English">
        </video>
        <h1>This is a test to learn about the track element</h1>
        <a href="https://github.com/Niki182/Video-captions-test" target="_blank"><button><i class="fab fa-github"></i> Github repository</button></a>
    </main>
</body>
</html>
